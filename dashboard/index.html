<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAZR Bloom Incident OS</title>
<meta name="description" content="JAZR v4.1/v5 operator control dashboard (ISA-101 HMI, ISA-18.2 alarms) — SIMULATED DATA, illustrative. Student entry, ATRC ATP 2026 ENEC track.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234e555c'/%3E%3Cpath d='M6 20c4-8 16-8 20 0' stroke='%23fff' stroke-width='3' fill='none'/%3E%3Cpath d='M10 20v6M16 20v7M22 20v6' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/hmi.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
</head>
<body>
<header class="appbar">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--eq-on)"/><path d="M6 20c4-8 16-8 20 0" stroke="var(--panel)" stroke-width="3" fill="none"/><path d="M10 20v6M16 20v7M22 20v6" stroke="var(--panel)" stroke-width="2"/></svg>
    JAZR · Bloom Incident OS <small>v4.1 / v5 · coastal nuclear plant intakes (concept)</small></div>
  <span class="simflag" title="All live values come from a simulated data generator. Not plant data.">SIMULATED DATA — illustrative</span>
  <div class="ctl"><label for="scen">Scenario</label><select id="scen"></select></div>
  <div class="ctl"><label for="speed">Speed</label><select id="speed"><option value="1">×1</option><option value="10">×10</option><option value="60">×60</option><option value="300">×300</option><option value="1200">×1200</option></select>
    <button class="btn" id="pause">Pause</button><button class="btn" id="reset" title="RESET: restart the current scenario from t = 0 (counters, states, alarms, logs)">⟲ RESET</button></div>
  <label class="ctl" title="Simulated operator approves routine steps after a delay so unattended demos progress. Untick to drive everything yourself."><input type="checkbox" id="autopilot" checked> training autopilot</label>
  <span class="sp"></span>
  <div class="asum" aria-label="Alarm summary"><span class="chip p1" id="as1">0</span><span class="chip p2" id="as2">0</span><span class="chip p3" id="as3">0</span><span class="chip p4" id="as4">0</span><span class="note" id="asUn" style="min-width:58px"></span></div>
  <span class="clock" id="clock">—</span>
  <div class="ctl"><select id="theme" aria-label="Theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select><button class="btn" id="wall" title="Larger type for the control-room wall">Wall</button></div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="note" style="padding:4px 12px;background:var(--panel2);border-bottom:1px solid var(--line)" id="scDesc"></div>
<main id="pages"></main>
<div class="fp-back" id="fpBack"></div>
<aside class="fp" id="fp" role="dialog" aria-modal="true" aria-labelledby="fpTitle"><header><div><b id="fpTitle"></b><div class="note" id="fpSub"></div></div><span style="flex:1"></span><button class="btn" id="fpClose" aria-label="Close faceplate">Close</button></header><div class="body" id="fpBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<footer class="statusbar"><span id="sbState"></span><span id="sbComms"></span><span id="sbSpeed"></span><span>Student concept, ATRC ATP 2026 ENEC track · model-based, no physical prototype · not plant software</span></footer>
<script src="js/evidence_data.js"></script>
<script src="js/evidence11.js"></script>
<script src="js/sim.js"></script>
<script src="js/alarms.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/pages.js"></script>
<script src="js/evidence.js"></script>
<script src="js/app.js"></script>
</body>
</html>
